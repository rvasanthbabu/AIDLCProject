spring:
  application:
    name: ideation-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ideation}
    username: ${DB_USERNAME:ideation}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 5000        # fail fast; no unbounded waits (RESILIENCY-10)
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate              # schema owned by Flyway, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true                  # cookies only over HTTPS (SECURITY-12)
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never             # no internal detail to clients (SECURITY-09)

ideation:
  auth:
    lockout-threshold: 5
    lockout-duration: PT15M
    login-rate-capacity: 10
  cycle:
    auto-close-interval-ms: 60000

logging:
  pattern:
    level: "%5p [corrId=%X{correlationId}]"
