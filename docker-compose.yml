# Local development orchestration for the Ideation Portal.
# Not production config: production uses managed, multi-zone PostgreSQL and a secrets manager.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ideation
      POSTGRES_USER: ideation
      POSTGRES_PASSWORD: ideation_local_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideation"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ideation
      DB_USERNAME: ideation
      DB_PASSWORD: ideation_local_only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
